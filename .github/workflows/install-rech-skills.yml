name: Install Rech baseline skills

on:
  push:
    paths:
      - '.rech-install/payload.part*'
      - '.github/workflows/install-rech-skills.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and install skills
        shell: bash
        run: |
          set -euo pipefail
          cat .rech-install/payload.part00a .rech-install/payload.part00b .rech-install/payload.part01 .rech-install/payload.part02 .rech-install/payload.part03 .rech-install/payload.part04a .rech-install/payload.part04b .rech-install/payload.part05 | tr -d '\n' | base64 -d > /tmp/rech-skills.zip
          unzip -t /tmp/rech-skills.zip
          rm -rf /tmp/rech-skills
          mkdir -p /tmp/rech-skills
          unzip -q /tmp/rech-skills.zip -d /tmp/rech-skills
          mkdir -p .claude/skills
          cp -a /tmp/rech-skills/.claude/skills/. .claude/skills/
          rm -rf .rech-install
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .claude/skills .rech-install || true
          if git diff --cached --quiet; then
            echo 'No skill changes to commit.'
            exit 0
          fi
          git commit -m 'feat: install Rech baseline skills'
          git push
